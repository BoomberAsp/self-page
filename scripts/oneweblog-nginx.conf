# OneWeblog

server {
    listen 80;
    listen [::]:80;
    server_name oneweblog.cn www.oneweblog.cn;

    location /_astro/ {
        root /opt/oneweblog/dist/client;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /files/ {
        alias /opt/oneweblog/public/files/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /images/ {
        alias /opt/oneweblog/public/images/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name oneweblog.cn www.oneweblog.cn;

    ssl_certificate /etc/letsencrypt/live/oneweblog.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oneweblog.cn/privkey.pem;

    location /_astro/ {
        root /opt/oneweblog/dist/client;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /files/ {
        alias /opt/oneweblog/public/files/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /images/ {
        alias /opt/oneweblog/public/images/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
